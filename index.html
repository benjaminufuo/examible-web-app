<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examible</title>
    <meta
      name="description"
      content="Examible is a web-based application designed to help students effectively prepare for their examination. The platform provides structured past questions, detailed explanations, and intelligent practice modes tailored to individual learning needs."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://examible.com" />
    <meta property="og:title" content="Examible — Smart Exam Preparation" />
    <meta
      property="og:description"
      content="Prepare smarter with structured past questions, detailed explanations, and intelligent practice modes tailored to your learning needs."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dltjsi3xx/image/upload/v1781513015/logo_msufwd.png"
    />
    <meta property="og:image:alt" content="Examible Logo" />
    <meta property="og:site_name" content="Examible" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Examible — Smart Exam Preparation" />
    <meta
      name="twitter:description"
      content="Prepare smarter with structured past questions, detailed explanations, and intelligent practice modes tailored to your learning needs."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dltjsi3xx/image/upload/v1781513015/logo_msufwd.png"
    />

    <!-- DNS Prefetch + Preconnect for Google Fonts (faster font loading) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload main CSS as non-blocking resource (reduces render-blocking delay by ~100ms) -->
    <link
      rel="preload"
      href="/assets/index.css"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript><link rel="stylesheet" href="/assets/index.css" /></noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
